<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Categories - REKHA Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .admin-nav {
            background-color: var(--white);
            padding: 20px 0;
            box-shadow: var(--shadow);
            margin-bottom: 40px;
        }
        .admin-nav .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .admin-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 30px;
            background: var(--white);
            border-radius: var(--border-radius);
            overflow: hidden;
            box-shadow: var(--shadow);
        }
        .admin-table th, .admin-table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        .admin-table th {
            background-color: var(--secondary-color);
            color: var(--white);
        }
        .admin-table img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 4px;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        .modal-content {
            background: var(--white);
            padding: 40px;
            border-radius: var(--border-radius);
            width: 100%;
            max-width: 600px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="admin-nav">
        <div class="container">
            <h2 class="logo">REKHA Admin</h2>
            <div class="nav-links">
                <a href="dashboard.html">Dashboard</a>
                <a href="manage-products.html">Manage Products</a>
                <a href="manage-categories.html">Manage Categories</a>
                <a href="#" onclick="auth.logout()">Logout</a>
            </div>
        </div>
    </div>

    <main class="container">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h1>Manage Categories</h1>
            <button class="btn" onclick="openModal('add')">Add New Category</button>
        </div>

        <table class="admin-table">
            <thead>
                <tr>
                    <th>Image</th>
                    <th>Name</th>
                    <th>Description</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="categories-table-body">
                <!-- Dynamically loaded -->
            </tbody>
        </table>
    </main>

    <!-- Category Modal -->
    <div id="category-modal" class="modal">
        <div class="modal-content">
            <h2 id="modal-title">Add Category</h2>
            <form id="category-form" style="margin-top: 20px;">
                <input type="hidden" id="category-id">
                <div class="form-group">
                    <label>Category Name</label>
                    <input type="text" id="c-name" required>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="c-description" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label>Category Image</label>
                    <input type="file" id="c-image" accept="image/*">
                    <p id="image-url-display" style="font-size: 0.8rem; color: #888; margin-top: 5px;"></p>
                    <input type="hidden" id="c-image-url">
                </div>
                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button type="submit" class="btn" style="flex: 1;">Save Category</button>
                    <button type="button" class="btn" style="flex: 1; background-color: #888;" onclick="closeModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/utils.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            auth.check();
            loadCategories();

            // Check if action=add is in URL
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('action') === 'add') openModal('add');
        });

        async function loadCategories() {
            const { data, error } = await supabaseClient
                .from('categories')
                .select('*')
                .order('name', { ascending: true });
            
            const tbody = document.getElementById('categories-table-body');
            if (data && data.length > 0) {
                tbody.innerHTML = data.map(cat => `
                    <tr>
                        <td><img src="${cat.image || 'https://via.placeholder.com/50'}" alt="${cat.name}"></td>
                        <td>${cat.name}</td>
                        <td>${cat.description || ''}</td>
                        <td>
                            <button class="btn" style="padding: 5px 10px; font-size: 0.8rem;" onclick='openModal("edit", ${JSON.stringify(cat).replace(/'/g, "&apos;")})'>Edit</button>
                            <button class="btn" style="padding: 5px 10px; font-size: 0.8rem; background-color: #ff4d4d;" onclick="deleteCategory(${cat.id})">Delete</button>
                        </td>
                    </tr>
                `).join('');
            } else {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align: center;">No categories found.</td></tr>';
            }
        }

        function openModal(mode, category = null) {
            const modal = document.getElementById('category-modal');
            const title = document.getElementById('modal-title');
            const form = document.getElementById('category-form');
            form.reset();
            document.getElementById('c-image-url').value = '';
            document.getElementById('image-url-display').textContent = '';

            if (mode === 'edit' && category) {
                title.textContent = 'Edit Category';
                document.getElementById('category-id').value = category.id;
                document.getElementById('c-name').value = category.name;
                document.getElementById('c-description').value = category.description || '';
                document.getElementById('c-image-url').value = category.image || '';
                document.getElementById('image-url-display').textContent = category.image ? 'Current image: ' + category.image.split('/').pop() : '';
            } else {
                title.textContent = 'Add New Category';
                document.getElementById('category-id').value = '';
            }
            modal.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('category-modal').style.display = 'none';
        }

        document.getElementById('category-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('category-id').value;
            const name = document.getElementById('c-name').value;
            const description = document.getElementById('c-description').value;
            const imageFile = document.getElementById('c-image').files[0];
            let image = document.getElementById('c-image-url').value;

            if (imageFile) {
                image = await uploadImage(imageFile);
                if (!image) {
                    alert("Image upload failed. Check Cloudinary config.");
                    return;
                }
            }

            const categoryData = { name, description, image };

            try {
                if (id) {
                    const { error } = await supabaseClient.from('categories').update(categoryData).eq('id', id);
                    if (error) throw error;
                    alert("Category updated!");
                } else {
                    const { error } = await supabaseClient.from('categories').insert([categoryData]);
                    if (error) throw error;
                    alert("Category added!");
                }
                closeModal();
                loadCategories();
            } catch (err) {
                alert("Error saving category: " + err.message);
            }
        });

        async function deleteCategory(id) {
            if (confirm("Are you sure you want to delete this category? All products in this category might be affected.")) {
                const { error } = await supabaseClient.from('categories').delete().eq('id', id);
                if (error) alert("Error deleting category: " + error.message);
                else loadCategories();
            }
        }
    </script>
</body>
</html>
