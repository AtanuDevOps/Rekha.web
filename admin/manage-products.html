<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Products - Artsy Avenue Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .admin-nav {
            background-color: var(--white);
            padding: 20px 0;
            box-shadow: var(--shadow);
            margin-bottom: 40px;
        }
        .admin-nav .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .admin-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 30px;
            background: var(--white);
            border-radius: var(--border-radius);
            overflow: hidden;
            box-shadow: var(--shadow);
        }
        .admin-table th, .admin-table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        .admin-table th {
            background-color: var(--secondary-color);
            color: var(--white);
        }
        .admin-table img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 4px;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        .modal-content {
            background: var(--white);
            padding: 40px;
            border-radius: var(--border-radius);
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="admin-nav">
        <div class="container">
            <h2 class="logo">Artsy Avenue Admin</h2>
            <div class="nav-links">
                <a href="dashboard.html">Dashboard</a>
                <a href="manage-products.html">Manage Products</a>
                <a href="manage-categories.html">Manage Categories</a>
                <a href="#" onclick="auth.logout()">Logout</a>
            </div>
        </div>
    </div>

    <main class="container">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h1>Manage Products</h1>
            <a href="add-product.html" class="btn">Add New Product</a>
        </div>

        <table class="admin-table">
            <thead>
                <tr>
                    <th>Image</th>
                    <th>Name</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="products-table-body">
                <!-- Dynamically loaded -->
            </tbody>
        </table>
    </main>

    <!-- Product Modal -->
    <div id="product-modal" class="modal">
        <div class="modal-content">
            <h2 id="modal-title">Add Product</h2>
            <form id="product-form" style="margin-top: 20px;">
                <input type="hidden" id="product-id">
                <div class="form-group">
                    <label>Product Name</label>
                    <input type="text" id="p-name" required>
                </div>
                <div class="form-group">
                    <label>Price ($)</label>
                    <input type="number" step="0.01" id="p-price" required>
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select id="p-category" required>
                        <option value="">Select Category</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="p-description" rows="4"></textarea>
                </div>
                <div class="form-group">
                    <label>Product Image</label>
                    <input type="file" id="p-image" accept="image/*">
                    <p id="image-url-display" style="font-size: 0.8rem; color: #888; margin-top: 5px;"></p>
                    <input type="hidden" id="p-image-url">
                </div>
                <div class="form-group" style="display: flex; align-items: center; gap: 10px;">
                    <input type="checkbox" id="p-is-hot" style="width: auto;">
                    <label for="p-is-hot" style="margin-bottom: 0;">Mark as Hot Product</label>
                </div>
                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button type="submit" class="btn" style="flex: 1;">Save Product</button>
                    <button type="button" class="btn" style="flex: 1; background-color: #888;" onclick="closeModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/utils.js"></script>
    <script>
        let categories = [];

        document.addEventListener('DOMContentLoaded', async () => {
            auth.check();
            await loadCategories();
            await loadProducts();
        });

        async function loadCategories() {
            const { data } = await supabaseClient.from('categories').select('*');
            categories = data || [];
            const select = document.getElementById('p-category');
            select.innerHTML = '<option value="">Select Category</option>' + 
                categories.map(cat => `<option value="${cat.name}">${cat.name}</option>`).join('');
        }

        async function loadProducts() {
            const { data, error } = await supabaseClient
                .from('products')
                .select('*')
                .order('created_at', { ascending: false });
            
            const tbody = document.getElementById('products-table-body');
            if (data && data.length > 0) {
                tbody.innerHTML = data.map(prod => `
                    <tr>
                        <td><img src="${prod.image_url || 'https://via.placeholder.com/50'}" alt="${prod.name}"></td>
                        <td>${prod.name}</td>
                        <td>${prod.category || 'N/A'}</td>
                        <td>$${prod.price}</td>
                        <td>
                            <button class="btn" style="padding: 5px 10px; font-size: 0.8rem;" onclick='openModal("edit", ${JSON.stringify(prod).replace(/'/g, "&apos;")})'>Edit</button>
                            <button class="btn" style="padding: 5px 10px; font-size: 0.8rem; background-color: #ff4d4d;" onclick="deleteProduct(${prod.id})">Delete</button>
                        </td>
                    </tr>
                `).join('');
            } else {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align: center;">No products found.</td></tr>';
            }
        }

        function openModal(mode, product = null) {
            const modal = document.getElementById('product-modal');
            const title = document.getElementById('modal-title');
            const form = document.getElementById('product-form');
            form.reset();
            document.getElementById('p-image-url').value = '';
            document.getElementById('image-url-display').textContent = '';

            if (mode === 'edit' && product) {
                title.textContent = 'Edit Product';
                document.getElementById('product-id').value = product.id;
                document.getElementById('p-name').value = product.name;
                document.getElementById('p-price').value = product.price;
                document.getElementById('p-category').value = product.category || '';
                document.getElementById('p-description').value = product.description || '';
                document.getElementById('p-is-hot').checked = product.is_hot || false;
                document.getElementById('p-image-url').value = product.image_url || '';
                document.getElementById('image-url-display').textContent = product.image_url ? 'Current image: ' + product.image_url.split('/').pop() : '';
            } else {
                title.textContent = 'Add New Product';
                document.getElementById('product-id').value = '';
                document.getElementById('p-is-hot').checked = false;
            }
            modal.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('product-modal').style.display = 'none';
        }

        document.getElementById('product-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('product-id').value;
            const name = document.getElementById('p-name').value;
            const price = parseFloat(document.getElementById('p-price').value);
            const category = document.getElementById('p-category').value;
            const description = document.getElementById('p-description').value;
            const is_hot = document.getElementById('p-is-hot').checked;
            const imageFile = document.getElementById('p-image').files[0];
            let image_url = document.getElementById('p-image-url').value;

            if (imageFile) {
                image_url = await uploadImage(imageFile);
                if (!image_url) {
                    alert("Image upload failed. Check Cloudinary config.");
                    return;
                }
            }

            const productData = { name, price, category, description, image_url, is_hot };

            try {
                if (id) {
                    const { error } = await supabaseClient.from('products').update(productData).eq('id', id);
                    if (error) throw error;
                    alert("Product updated!");
                } else {
                    const { error } = await supabaseClient.from('products').insert([productData]);
                    if (error) throw error;
                    alert("Product added!");
                }
                closeModal();
                loadProducts();
            } catch (err) {
                alert("Error saving product: " + err.message);
            }
        });

        async function deleteProduct(id) {
            if (confirm("Are you sure you want to delete this product?")) {
                const { error } = await supabaseClient.from('products').delete().eq('id', id);
                if (error) alert("Error deleting product: " + error.message);
                else loadProducts();
            }
        }
    </script>
</body>
</html>
