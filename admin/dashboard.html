<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - REKHA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
            margin-top: 50px;
        }
        .stat-card {
            background-color: var(--white);
            padding: 30px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            text-align: center;
        }
        .stat-number {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--accent-color);
            display: block;
        }
        .admin-nav {
            background-color: var(--white);
            padding: 20px 0;
            box-shadow: var(--shadow);
            margin-bottom: 40px;
        }
        .admin-nav .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="admin-nav">
        <div class="container">
            <h2 class="logo">REKHA Admin</h2>
            <div class="nav-links">
                <a href="dashboard.html">Dashboard</a>
                <a href="manage-products.html">Manage Products</a>
                <a href="manage-categories.html">Manage Categories</a>
                <a href="#" onclick="auth.logout()">Logout</a>
            </div>
        </div>
    </div>

    <main class="container">
        <h1 id="admin-welcome">Welcome back, Admin</h1>
        <div class="dashboard-grid">
            <div class="stat-card">
                <h3>Total Products</h3>
                <span id="total-products" class="stat-number">0</span>
            </div>
            <div class="stat-card">
                <h3>Total Categories</h3>
                <span id="total-categories" class="stat-number">0</span>
            </div>
        </div>

        <div style="margin-top: 50px;">
            <h2>Quick Actions</h2>
            <div style="display: flex; gap: 20px; margin-top: 20px;">
                <a href="add-product.html" class="btn">Add New Product</a>
                <a href="manage-categories.html?action=add" class="btn" style="background-color: var(--secondary-color);">Add New Category</a>
            </div>
        </div>
    </main>

    <script src="../js/config.js"></script>
    <script src="../js/utils.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Check auth (sync now)
            auth.check();

            // Display admin name
            const user = JSON.parse(localStorage.getItem('rekha_admin_user'));
            if (user) {
                document.getElementById('admin-welcome').textContent = `Welcome back, ${user.name}`;
            }

            // Fetch stats
            try {
                const { count: productCount } = await supabaseClient
                    .from('products')
                    .select('*', { count: 'exact', head: true });
                
                const { count: categoryCount } = await supabaseClient
                    .from('categories')
                    .select('*', { count: 'exact', head: true });

                document.getElementById('total-products').textContent = productCount || 0;
                document.getElementById('total-categories').textContent = categoryCount || 0;
            } catch (e) {
                console.error("Error fetching stats:", e);
            }
        });
    </script>
</body>
</html>
